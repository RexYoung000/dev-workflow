name: Cross-platform tests

on:
  push:
    branches: [main]
    paths:
      - 'skill/**'
      - 'scripts/**'
      - 'tests/**'
      - '.gitattributes'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'skill/**'
      - 'scripts/**'
      - 'tests/**'
      - '.gitattributes'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.9', '3.13']
        include:
          - os: macos-15-intel
            python: '3.9'
          - os: macos-latest
            python: '3.13'
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Environment
        run: python --version
      - name: Isolated CLI and installation tests
        run: python -m unittest discover -s tests -v
